# GitHub opens a pull request when a NuGet package or a workflow action has a newer or safer version.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      efcore:
        patterns: ["Microsoft.EntityFrameworkCore*"]
      azure:
        patterns: ["Azure.*", "OpenTelemetry*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
